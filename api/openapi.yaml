openapi: 3.0.3
info:
  contact:
    email: hello@spatio.app
    name: Spatio Support
    url: https://spatio.app
  description: |
    The REST API that owns every resource in your Spatio workspace: notes,
    sheets, slides, tasks, calendar events, mail, chat, files, and contacts.
    SpatioMCP wraps this API; Spatio Desktop reads from it. You can call it
    directly from your own code.

    All requests must be authenticated with a Personal Access Token
    (`Authorization: Bearer pat_...`) or an OAuth 2.1 access token, and use HTTPS.

    Official SDKs (MIT, generated from this spec on every release):

    - TypeScript: https://github.com/spatio-labs/spatio-ts (`npm install @spatio/sdk-ts`)
    - Python: https://github.com/spatio-labs/spatio-py (`pip install spatio-sdk`)
    - Go: https://github.com/spatio-labs/spatio-go (`go get github.com/spatio-labs/spatio-go`)

    This specification is generated from the platform-service Go source on
    every push to `main`. The spec, not hand-written documentation, is the
    source of truth: server stubs and SDKs are generated from it, and any
    drift between the spec and the running service fails CI.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: SpatioAPI
  version: v1
servers:
- description: Production
  url: https://api.spatio.app
security:
- bearerAuth: []
tags:
- description: "Markdown notes, blocks, comments, and public share links."
  name: Notes
- description: "Spreadsheets, rows, and cells."
  name: Sheets
- description: "Presentations, slides, canvas elements, sharing, and PDF export."
  name: Slides
- description: "To-dos, reminders, and issues with comments + bulk operations."
  name: Tasks
- description: "Email — send/reply, list/get/update/delete, threads, attachments,\
    \ drafts, labels, search."
  name: Mail
- description: "Calendar events with recurrence, attendees, reminders, conference\
    \ data, and provider sync."
  name: Calendar
- description: Group chat channels (Slack-style). Backed by the shared messaging engine;
    sibling of DirectMessages.
  name: Channels
- description: "1:1 and group direct messages with reactions, threads, mute/pin/draft\
    \ state, attachments, and search."
  name: DirectMessages
- description: "Files + folders across connected providers (native R2 storage, Google\
    \ Drive, Dropbox). Supports multipart and base64 upload, chunked content-addressed\
    \ uploads, bulk operations, search, and PDF text extraction."
  name: Files
- description: "Organizations, their members, and invitation flow. Organizations contain\
    \ workspaces; seat counts roll up to billing."
  name: Organizations
- description: Workspaces and their members. Workspaces live inside organizations
    and are the unit of resource scoping for Personal Access Tokens.
  name: Workspaces
- description: |
    Account-level endpoints — billing tier, quotas, today's usage,
    free-trial agent-task gating, and security (sign-in methods,
    password change, active sessions).
  name: Account
- description: "Persisted LLM conversations (titles, messages, metadata) used by the\
    \ agent + sidebar chats."
  name: Conversations
- description: "Unified inbox feed across mail, channels, DMs, mentions, and system\
    \ notifications."
  name: Inbox
- description: Agent-authored proposals that surface on the home feed.
  name: Recommendations
- description: |
    Agent configuration management (`/v1/agents`) plus agent
    runtime endpoints (`/v1/agent/*`) — conversations,
    action execution, session-context bundle.
  name: Agents
- description: |
    Action manifest + renderer-curated "core actions" backing the
    command palette and key bindings.
  name: Actions
- description: User-customizable keyboard shortcuts merged with platform defaults.
  name: Keybindings
- description: "Voice/video calls — meetings, rooms, recordings, bandwidth metrics."
  name: Calls
- description: Cross-provider contacts and org-scoped contact categories.
  name: Contacts
- description: Org-scoped record types + records (lightweight CRM-style entities).
  name: Records
- description: User-issued API tokens (PATs) used to authenticate against this API.
  name: PersonalAccessTokens
- description: Saved scheduled-agent templates (routines) and their execution runs.
  name: Routines
- description: "Locally-built prototype apps rendered in an Electron <webview>, with\
    \ project-scoped file ops."
  name: Apps
- description: Email folders (inbox-side organization).
  name: Folders
- description: Native + OAuth integrations and the multi-account directory backing
    them.
  name: Connections
- description: "Code repository platform — native Spatio repos plus connected providers\
    \ (GitHub, GitLab, …). Repos, pull requests, issues, branches, commits, workflows."
  name: Repo
- description: LLM model catalog (admin-managed).
  name: Models
- description: Spatio's first-party native DM messaging (`/v1/native/dm/*`). Distinct
    from the cross-provider `/v1/direct-messages` directory.
  name: NativeDM
- description: "User-level + workspace-level settings, including the mail-read-receipts\
    \ preference and the bulk-update endpoint."
  name: Settings
- description: Per-user notification preferences (the dispatcher's toggle grid).
  name: Notifications
- description: "Terminal session metadata (PTY bytes flow over IPC, not this API)."
  name: Terminal
- description: "Per-resource ACL grants — `/v1/resources/{platform}/{resourceId}/permissions/*`."
  name: Resources
- description: "Installable-platform catalog, manifest discovery, data plane (query/exec/migrate/tables),\
    \ secrets, and backend tokens."
  name: Platforms
- description: Sidebar/navigation tree the renderer uses to render its surface.
  name: Navigation
- description: "Renderer-driven endpoints — bootstrap, slug validation, layout, pinned\
    \ platforms, user permissions/profile, workspace activity."
  name: Misc
- description: Domain/email logo lookups (CDN-cached).
  name: Logos
- description: |
    OAuth 2.1 + OpenID Connect 1.0 authorization server. Third-party
    apps register here, redirect users through the consent flow, and
    receive access tokens (and id_tokens when `openid` scope is
    granted). See packages/api-spec/CLONE-PARITY.md for the
    clone-builder perspective.
  name: OAuth
- description: |
    WebSocket-adjacent REST endpoints (token exchange for the Yjs
    collaboration worker). The `/ws` hub itself is documented in
    `docs/realtime.md` because OpenAPI 3.0 cannot describe
    websockets natively.
  name: Realtime
- description: |
    Cross-platform federated full-text search. Fans out to every
    per-platform search method in parallel.
  name: Search
paths:
  /v1/notes:
    get:
      description: |
        Fan-out list. Returns every note visible to the caller across
        every connected notes provider, paginated by `limit` / `offset`.
        Pass `?accountId=` or `?provider=` to scope to a single source.
      operationId: listNotes
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: "When `true`, return archived notes instead of active ones."
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Filter to notes nested under this parent note id.
        explode: true
        in: query
        name: parent_id
        required: false
        schema:
          type: string
        style: form
      - description: Repeatable. Filter to notes carrying every tag listed.
        explode: true
        in: query
        name: tags
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Max items to return. Defaults to 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
        style: form
      - description: Number of items to skip.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: |
          Sort field. Provider-dependent; the native provider supports
          `updated_at`, `created_at`, `title`.
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: updated_at
          type: string
        style: form
      - explode: true
        in: query
        name: sort_order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListEnvelope"
          description: Fan-out envelope.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resolver or fan-out failure.
      summary: List notes across connected accounts.
      tags:
      - Notes
    post:
      description: |
        Creates a new note under the target account. The target is
        resolved in this order: `accountId` field on the body →
        `?accountId=` query → `provider` field on the body →
        `?provider=` query → the caller's single connected account
        (errors with `ambiguous_account` if more than one is connected
        and no selector is supplied).
      operationId: createNote
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
          description: Note created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createNote_400_response"
          description: |
            Invalid body, or no selector supplied with multiple connected
            accounts (`code: ambiguous_account`), or no notes provider
            connected (`code: no_notes_provider`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Provider failure.
      summary: Create a note.
      tags:
      - Notes
  /v1/notes/{id}:
    delete:
      operationId: deleteNote
      parameters:
      - description: Note id.
        explode: false
