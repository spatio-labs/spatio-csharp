              $ref: "#/components/schemas/CreatePresentationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
          description: Presentation created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createNote_400_response"
