        name: accountIds
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "Repeatable. Restrict to these provider ids (`gmail`, `outlook`)."
        explode: true
        in: query
        name: providers
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
