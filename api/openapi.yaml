          description: Read-only snapshot of the shared note.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing token.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRequiredError"
          description: |
            Password-protected note. `requiresPassword: true` always set;
            `invalidPassword: true` only when a password was supplied
            and rejected.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Token unknown or sharing disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Snapshot rendering failure.
      security: []
      summary: Fetch a publicly shared note.
      tags:
      - Notes
  /v1/sheets:
    get:
      description: |
        Fan-out list. Returns every sheet visible to the caller across
        every connected sheets provider, paginated by `limit` / `offset`.
        Pass `?accountId=` or `?provider=` to scope to a single source.
      operationId: listSheets
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetListEnvelope"
          description: Fan-out envelope.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resolver or fan-out failure.
      summary: List sheets across connected accounts.
      tags:
      - Sheets
    post:
      description: |
        Creates a new sheet under the target account. Target resolution
        mirrors `POST /v1/notes`: body `accountId` → `?accountId=` →
        body `provider` → `?provider=` → caller's single connected
        account (errors with `ambiguous_account` if more than one is
        connected and no selector is supplied).
