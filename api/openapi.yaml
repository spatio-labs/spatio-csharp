  /public/slides/{token}:
    get:
      description: |
        Unauthenticated. Mirror of `GET /public/notes/{token}`. The
        share token is the credential. For password-protected decks
        the password is supplied via `?password=`; the response
        distinguishes "no password supplied" from "wrong password" so
        the viewer can render the right prompt. Unknown tokens and
        disabled-share decks both return `404` to prevent enumeration.
      operationId: getPublicPresentation
      parameters:
      - description: Opaque public-share token.
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Optional viewer password.
        explode: true
        in: query
        name: password
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                description: |
                  Provider-shaped snapshot — schema is currently free-
                  form because the snapshot is the same struct the
                  native-slides provider renders. Future revisions will
                  pin this once the snapshot stabilizes.
                type: object
          description: Read-only snapshot of the shared presentation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing token.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRequiredError"
          description: |
            Password-protected deck. `requiresPassword: true` always set;
            `invalidPassword: true` only when a password was supplied
            and rejected.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Token unknown or sharing disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Snapshot rendering failure.
      security: []
      summary: Fetch a publicly shared presentation.
      tags:
      - Slides
  /v1/tasks:
    get:
      description: |
        Fan-out list. Returns every task visible to the caller across
        every connected tasks provider. Pass `?accountId=` or
        `?provider=` to scope to a single source.
      operationId: listTasks
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: |
          Include completed tasks. Default `false` (active tasks only).
        explode: true
        in: query
        name: completed
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Repeatable. Filter to tasks carrying every label listed.
        explode: true
        in: query
        name: labels
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Filter to subtasks of this parent.
        explode: true
        in: query
        name: parentTaskId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Discriminator filter (`todo`, `reminder`, `issue`).
        explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - description: Filter to tasks linked to a given source platform.
        explode: true
        in: query
        name: sourcePlatform
        required: false
        schema:
          type: string
        style: form
      - description: |
          Filter to tasks linked to a specific source artifact id.
          Pair with `sourcePlatform` for an exact match.
        explode: true
        in: query
        name: sourceId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListEnvelope"
          description: Fan-out envelope.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resolver or fan-out failure.
      summary: List tasks across connected accounts.
      tags:
      - Tasks
    post:
      description: |
        Creates a new task under the target account. Target resolution
        mirrors `POST /v1/notes`: body `accountId` → `?accountId=` →
        body `provider` → `?provider=` → caller's single connected
        account (errors `ambiguous_account` if more than one and no
        selector).
      operationId: createTask
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          description: Task created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createNote_400_response"
          description: |
