  /v1/realtime/collaboration-token:
    post:
      description: |
        The Yjs Cloudflare Worker that powers live document
        collaboration (`wss://realtime-collaboration.<account>.workers.dev`)
        only accepts platform-signed JWTs. Third-party clients holding
        an OAuth access token or PAT call this endpoint to mint a
        5-minute collaboration JWT they can present to the worker.

        The minted JWT inherits user + workspace identity from the
        presenting bearer token. Optionally scope it to a single room
        by supplying `room` in the request body.
      operationId: issueCollaborationToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/issueCollaborationToken_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/issueCollaborationToken_200_response"
          description: Token issued.
        "401":
          description: Bearer token invalid.
        "500":
          description: Server misconfigured (JWT_SECRET unset).
      security:
      - bearerAuth: []
      summary: Exchange a bearer token for a short-lived Yjs collaboration JWT.
      tags:
      - Realtime
  /v1/search:
    post:
      description: |
        Fans out to every platform's per-platform search method in
        parallel, merges + dedupes results, and returns them in a
        relevance-then-recency ranking with per-platform cursors for
        pagination.
      operationId: federatedSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/federatedSearch_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/federatedSearch_200_response"
          description: Search results.
        "400":
          description: Missing query.
        "401":
          description: Unauthorized.
      security:
      - bearerAuth: []
      summary: Cross-platform federated search.
      tags:
      - Search
components:
  parameters:
    AccountId:
      description: |
        Connected-account row id. Selects which provider account this
        request targets when more than one is connected. Mutually exclusive
        with `provider`. If omitted on a list endpoint the call fans out
        across every connected account.
      explode: true
      in: query
      name: accountId
      required: false
      schema:
        type: string
      style: form
    Provider:
      description: |
        Provider id (e.g. `native-notes`, `notion`). Selects every
        connected account for the provider. Mutually exclusive with
        `accountId`.
      explode: true
      in: query
      name: provider
      required: false
      schema:
        type: string
      style: form
    WorkspaceIdHeader:
      description: |
        Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
        tokens carry this implicitly; for session/JWT auth without a scoped
        PAT, pass it explicitly.
      explode: false
      in: header
      name: X-Workspace-ID
      required: false
      schema:
        type: string
      style: simple
    NoteId:
      description: Note id.
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    BlockId:
      description: Block id.
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    CommentId:
      description: Comment id.
      explode: false
      in: path
      name: commentId
      required: true
      schema:
        type: string
      style: simple
    ShareToken:
      description: Opaque public-share token.
      explode: false
      in: path
      name: token
      required: true
      schema:
        type: string
      style: simple
    SheetId:
      description: Sheet id.
      explode: false
      in: path
      name: id
      required: true
      schema:
