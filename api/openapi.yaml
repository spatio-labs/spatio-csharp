  /v1/calendar/capabilities:
    get:
      description: |
        Returns the capabilities the provider declares for the given
        connected account. The renderer uses these to enable/disable
        form fields (recurrence picker, attendee inputs, etc.).
      operationId: getCalendarCapabilities
      parameters:
      - description: |
          Connected-account id (snake_case in this platform — the rest of
          the SpatioAPI uses `accountId`). Required for single-event
          operations.
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarCapabilitiesResponse"
          description: Capabilities envelope.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing account_id.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account not found.
      summary: Per-account capability flags.
      tags:
      - Calendar
  /v1/calendar/sync:
    post:
      description: |
        Enqueues sync jobs (one per connected calendar account) and
        returns immediately with the job ids. Pass `?wait=true` to
        block until all jobs complete (10-second polling budget); the
        response is then `200` with `waited: true` and a `timed_out`
        flag if any job didn't finish in time.
      operationId: syncCalendar
      parameters:
      - description: Block until all sync jobs finish (10s timeout).
        explode: true
        in: query
        name: wait
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResponse"
          description: Synchronous completion (only when `?wait=true`).
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResponse"
          description: Sync jobs enqueued; check the worker for completion.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Sync queue not configured.
      summary: Trigger a sync across connected calendar accounts.
      tags:
      - Calendar
