  /.well-known/oauth-authorization-server:
    get:
      description: |
        Returns the canonical metadata for the Spatio OAuth 2.1 + OpenID
        Connect server. Third-party RPs use this to auto-discover
        endpoint URLs, supported scopes, and signing algorithms.

        Identical payload to `/.well-known/openid-configuration` —
        either path is acceptable; OIDC clients prefer the
        openid-configuration alias.
      operationId: getOAuthDiscovery
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDocument"
          description: Metadata document.
      security: []
      summary: OAuth 2.1 authorization server metadata (RFC 8414).
      tags:
      - OAuth
  /.well-known/openid-configuration:
    get:
      description: |
        Alias of `/.well-known/oauth-authorization-server`. Provided so
        OIDC client libraries (NextAuth, Auth.js, oidc-client-ts,
        passport-openidconnect) auto-detect Spatio as an OIDC provider
        via their `wellKnown` / `discoveryUrl` config field.
      operationId: getOpenIDConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDocument"
          description: Metadata document.
      security: []
      summary: OpenID Connect Discovery 1.0 metadata.
      tags:
      - OAuth
  /.well-known/jwks.json:
    get:
      description: |
        The set of public keys RPs use to verify Spatio-issued
        id_tokens. Cached for 5 minutes at the edge. Always includes
        the currently-active signing key plus any retired keys that
        may still be in circulation (id_token TTL is 1 hour + slack).
      operationId: getJWKS
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
          description: Key set.
      security: []
      summary: JSON Web Key Set for id_token verification (RFC 7517).
      tags:
      - OAuth
  /oauth2/register:
    post:
      description: |
        Returns a fresh `client_id` (and, for confidential clients,
        `client_secret`) plus a one-time `registration_access_token`
        the client can use later to update its registration. Public
        clients (mobile, SPA) MUST use `token_endpoint_auth_method:
        none` and PKCE.

        Rate-limited to 10 registrations per hour per source IP.
      operationId: registerOAuthClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRegistrationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRegistrationResponse"
          description: Client registered.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: Invalid metadata.
        "429":
          description: Rate limit exceeded.
      security: []
      summary: Register a new OAuth 2.1 client (RFC 7591 dynamic client registration).
      tags:
      - OAuth
  /oauth2/authorize:
    get:
      description: |
        Browser-redirect endpoint. Validates the client + redirect_uri,
        packs the request into a signed JWT, and 302s the user's
        browser to the consent UI. The consent UI then POSTs to
        `/oauth2/authorize/confirm` with the user's decision.

        OIDC additions: `scope=openid+profile+email`, `nonce`, `prompt`
        (none|login|consent), `max_age`.
      operationId: oauthAuthorize
      parameters:
      - explode: true
        in: query
        name: client_id
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: redirect_uri
        required: true
        schema:
          format: uri
          type: string
        style: form
      - explode: true
        in: query
        name: response_type
        required: true
        schema:
          enum:
          - code
          type: string
        style: form
      - explode: true
        in: query
        name: scope
        required: false
        schema:
          description: Space-separated scope list.
          type: string
        style: form
      - explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: code_challenge
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: code_challenge_method
        required: true
        schema:
          enum:
          - S256
          type: string
        style: form
      - explode: true
        in: query
        name: nonce
        required: false
        schema:
          description: OIDC nonce — echoed into the id_token.
          type: string
        style: form
      - explode: true
        in: query
        name: prompt
        required: false
        schema:
          enum:
          - none
          - login
          - consent
          type: string
        style: form
      - explode: true
        in: query
        name: max_age
        required: false
        schema:
          description: Maximum age (seconds) since last user authentication.
          type: integer
        style: form
      responses:
        "302":
          description: Redirect to consent UI or back to redirect_uri with error.
      security: []
      summary: OAuth 2.1 authorization endpoint (RFC 6749 + 7636 PKCE).
      tags:
      - OAuth
  /oauth2/token:
