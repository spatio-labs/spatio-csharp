  /v1/files:
    get:
      description: |
        Fan-out list. Returns files from every connected file provider
        unless filtered by `?accountId=` or `?provider=`. Folder
        contents are scoped via `?folderId=`; omit for account root.
      operationId: listFiles
      parameters:
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Provider id (e.g. `native-notes`, `notion`). Selects every
          connected account for the provider. Mutually exclusive with
          `accountId`.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Filter to one folder. Omit for the account root.
        explode: true
        in: query
        name: folderId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: workspaceId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: organizationId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: "Provider-dependent. Common values: `created_at`, `name`, `size`."
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: created_at
          type: string
        style: form
      - explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: DESC
          enum:
          - ASC
          - DESC
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListEnvelope"
          description: Fan-out envelope.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resolver or fan-out failure.
      summary: List files across connected file providers.
      tags:
      - Files
