  /v1/slides/{id}/export/pdf:
    post:
      description: |
        Proxies to the Spatio export sidecar (Playwright). Two response
        modes selected via `?storage=`:

          - `stream` (default) — response body is the PDF binary
            (`application/pdf`).
          - `r2` — uploads the rendered PDF to R2 storage and returns
            a JSON envelope with a 24-hour signed URL.

        Returns `503 Service Unavailable` when the export sidecar is
        not configured (dev fallback to the client-side exporter).
      operationId: exportPresentationPdf
      parameters:
      - description: Presentation id.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: storage
        required: false
        schema:
          default: stream
          enum:
          - stream
          - r2
          type: string
        style: form
      - description: Sanitized base name for the downloaded PDF.
        explode: true
        in: query
        name: filename
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPDFRequest"
        required: false
      responses:
        "200":
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPDFR2Response"
          description: |
            Either the PDF binary (when `?storage=stream`) or a JSON
            envelope with a signed URL (when `?storage=r2`).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Missing id, presentation has no slides, or invalid body."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Export sidecar unreachable or upstream R2 failure.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Export sidecar not configured.
      summary: Render the presentation as a PDF.
      tags:
      - Slides
  /v1/slides/{id}/export/pptx:
    post:
      description: |
        Proxies to the Spatio export sidecar (Playwright + pptxgenjs).
        Each slide is screenshotted at 2× device-pixel ratio and wrapped
        into a PowerPoint .pptx as a full-bleed image. Visual fidelity is
        preserved exactly — what renders in Spatio renders identically in
        PowerPoint, Keynote, Google Slides — at the cost of in-PowerPoint
        editability of slide content. Users edit slide content back in
        Spatio (the source of truth), not inside PowerPoint.

        Two response modes selected via `?storage=`:

          - `stream` (default) — response body is the PPTX binary
            (`application/vnd.openxmlformats-officedocument.presentationml.presentation`).
          - `r2` — uploads the rendered PPTX to R2 storage and returns
            a JSON envelope with a 24-hour signed URL.

        Returns `503 Service Unavailable` when the export sidecar is
        not configured.
      operationId: exportPresentationPptx
      parameters:
      - description: Presentation id.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Connected-account row id. Selects which provider account this
          request targets when more than one is connected. Mutually exclusive
          with `provider`. If omitted on a list endpoint the call fans out
          across every connected account.
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: storage
        required: false
        schema:
          default: stream
          enum:
          - stream
          - r2
          type: string
        style: form
      - description: Sanitized base name for the downloaded PPTX.
        explode: true
        in: query
        name: filename
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPDFRequest"
        required: false
      responses:
        "200":
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                format: binary
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPDFR2Response"
          description: |
            Either the PPTX binary (when `?storage=stream`) or a JSON
            envelope with a signed URL (when `?storage=r2`).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Missing id, presentation has no slides, or invalid body."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Export sidecar unreachable or upstream R2 failure.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Export sidecar not configured.
      summary: Render the presentation as a PowerPoint (.pptx) file.
      tags:
      - Slides
