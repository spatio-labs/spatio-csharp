  /v1/calendar/events:
    get:
      description: |
        Fan-out list. Returns events across every connected calendar
        provider unless filtered by `account_ids[]` or `providers[]`.
        Supports the cross-platform repeated-or-comma-separated filter
        syntax (`?account_ids=a&account_ids=b` or `?account_ids=a,b`).

        Time bounds (`timeMin` / `timeMax`) accept both RFC3339 and
        RFC3339Nano. The handler also accepts the snake_case
        `time_min` / `time_max` for direct curl callers; the spec
        models the camelCase form because that's what the renderer
        and SDKs use.
      operationId: listCalendarEvents
      parameters:
      - description: Repeatable. Restrict to specific connected accounts.
        explode: true
        in: query
        name: account_ids
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "Repeatable. Restrict to provider ids (`google-calendar`, etc.)."
        explode: true
        in: query
        name: providers
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Inclusive lower-bound time. RFC3339 or RFC3339Nano.
        explode: true
        in: query
        name: timeMin
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Inclusive upper-bound time.
        explode: true
        in: query
        name: timeMax
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Max events to return per page (default 50).
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listCalendarEvents_200_response"
          description: |
            Operation envelope. `data` is `ListEventsData`. Per-account
            fetch failures appear in `errors` rather than failing the
            whole call.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resolver or fan-out failure.
      summary: List calendar events across connected accounts.
      tags:
      - Calendar
    post:
      description: |
        Single-account create. `account_id` is required (no auto-resolve
        for write operations). Reminder array is mirrored into native
        tasks under the hood; conference data is auto-attached when
        `conference_type` is supplied.
      operationId: createCalendarEvent
      parameters:
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCalendarEvent_201_response"
          description: |
            Operation envelope. `data` is the created `Event`.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid body or missing `account_id`.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Provider or capability failure.
      summary: Create a calendar event.
      tags:
      - Calendar
  /v1/calendar/events/{id}:
    delete:
      description: |
        Hard delete (no soft-delete / trash). Cascades to any reminder
        tasks the platform created from this event.
      operationId: deleteCalendarEvent
      parameters:
      - description: Event id.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: |
          Connected-account id (snake_case in this platform — the rest of
          the SpatioAPI uses `accountId`). Required for single-event
          operations.
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarOperationResult"
          description: |
            Operation envelope. `metadata` carries `deleted_event_id`
            and `deleted_at`.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing id or account_id.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Event not found.
      summary: Delete an event.
      tags:
      - Calendar
    get:
      description: |
        Requires `?account_id=` to identify the source account.
        Response is the bare `Event` (not wrapped in
        CalendarOperationResult — distinct from the list/create/update
        shapes).
      operationId: getCalendarEvent
      parameters:
      - description: Event id.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: |
          Connected-account id (snake_case in this platform — the rest of
          the SpatioAPI uses `accountId`). Required for single-event
          operations.
        explode: true
        in: query
        name: account_id
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatioEvent"
          description: The event.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing id or account_id.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Event not found.
      summary: Fetch one event.
      tags:
      - Calendar
    patch:
      description: |
        Partial update. `account_id` may be supplied in the body
        (preferred) or as `?account_id=` query param — the renderer's
        update path puts it in the URL while create puts it in the
        body. `updates` is a free-form map; the platform's capability
        gate rejects fields the provider doesn't support.
      operationId: updateCalendarEvent
      parameters:
      - description: Event id.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Workspace scope for unscoped tokens. Workspace-scoped PATs and OAuth
          tokens carry this implicitly; for session/JWT auth without a scoped
          PAT, pass it explicitly.
        explode: false
        in: header
        name: X-Workspace-ID
        required: false
        schema:
          type: string
        style: simple
      - description: Optional account-id filter (snake_case).
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCalendarEvent_201_response"
          description: |
            Operation envelope. `data` is the updated `Event`.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid body, missing id, or missing account_id."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Caller is not authenticated.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Event not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Provider or capability failure.
      summary: Update an event (sparse).
      tags:
      - Calendar
  /v1/calendar/providers:
    get:
      description: |
        Static list of provider ids the Calendar platform can connect
        to. Returned regardless of which providers the caller has
        actually authorized.
      operationId: listCalendarProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarProvidersInfo"
          description: Provider info.
        "401":
